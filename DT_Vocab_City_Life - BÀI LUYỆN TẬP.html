<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&amp;T Academy – Từ vựng: City Life &amp; Comparatives</title>
<style>
:root{--g:#2E7D32;--g2:#43A047;--gl:#E8F5E9;--gm:#A5D6A7;--y:#FFD54F;--r:#E53935;--ink:#1B2A1E;--mut:#5f6f62}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:#F4FAF4;color:var(--ink)}
header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:14px 16px 10px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header h1{margin:0;font-size:19px}
header .sub{font-size:13px;opacity:.9;margin-top:2px}
.prog{margin-top:8px;background:rgba(255,255,255,.3);border-radius:99px;height:10px;overflow:hidden}
.prog>div{height:100%;background:var(--y);width:0;transition:width .4s}
.progtxt{font-size:12px;margin-top:3px}
.wrap{max-width:860px;margin:0 auto;padding:12px}
.groups{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.groups button,.modes button{flex:0 0 auto;border:2px solid var(--gm);background:#fff;color:var(--g);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer}
.groups button.on,.modes button.on{background:var(--g);border-color:var(--g);color:#fff}
.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.modes button{border-radius:14px;padding:10px 4px;font-size:13px}
.modes button span{display:block;font-size:22px}
@media(max-width:560px){.modes{grid-template-columns:repeat(3,1fr)}.modes button{font-size:12px}}
.tin{width:100%;max-width:420px;padding:14px;font-size:22px;text-align:center;border:3px solid var(--gm);border-radius:14px;margin-top:14px;font-weight:700;color:var(--g)}
.tin.bad{border-color:var(--r);color:var(--r);animation:sh .35s}.tin.ok{border-color:var(--g);background:var(--gl)}
.mask{font-size:22px;letter-spacing:6px;color:var(--mut);margin-top:8px;font-weight:700}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(46,125,50,.1);margin-bottom:12px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.w{position:relative;background:#fff;border-radius:16px;padding:12px 14px;border-left:6px solid var(--gm);box-shadow:0 1px 6px rgba(0,0,0,.06)}
.w.known{border-left-color:var(--g)}
.w .en{font-size:20px;font-weight:700;color:var(--g)}
.w .ipa{color:var(--mut);font-size:14px}
.w .pos{display:inline-block;font-size:11px;background:var(--gl);color:var(--g);border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.w .vi{font-size:16px;margin:4px 0;font-weight:600}
.w .ex{font-size:14px;color:#333;font-style:italic}
.w .cmp{font-size:14px;color:#8a5a00;font-weight:600}
.spk{border:none;background:var(--gl);border-radius:50%;width:36px;height:36px;font-size:17px;cursor:pointer;flex:0 0 auto}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stars{font-size:12px;color:#f9a825;letter-spacing:1px}
b.t{color:var(--g);font-style:normal}
.btn{border:none;border-radius:14px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer;background:var(--g);color:#fff}
.btn.sec{background:#fff;color:var(--g);border:2px solid var(--g)}
.btn.red{background:#fff;color:var(--r);border:2px solid var(--r)}
.center{text-align:center}
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut);margin-bottom:8px}
.qbar{height:8px;background:var(--gl);border-radius:99px;overflow:hidden;margin-bottom:14px}.qbar>div{height:100%;background:var(--g2);transition:width .3s}
.big{font-size:30px;font-weight:800;color:var(--g);margin:6px 0}
.hint{font-size:18px;font-weight:600;margin:6px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media(max-width:480px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid var(--gm);background:#fff;border-radius:14px;padding:14px 10px;font-size:17px;font-weight:600;cursor:pointer;color:var(--ink)}
.opt.ok{background:var(--g);border-color:var(--g);color:#fff}
.opt.bad{background:#FFEBEE;border-color:var(--r);color:var(--r);animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.flash{perspective:1000px;height:260px;cursor:pointer;margin:8px 0 14px}
.fi{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.flip .fi{transform:rotateY(180deg)}
.fs{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
.front{background:linear-gradient(135deg,#fff,var(--gl));border:3px solid var(--gm)}
.back{background:var(--g);color:#fff;transform:rotateY(180deg)}
.back .big{color:#fff}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:14px 0;min-height:48px}
.slot{width:34px;height:42px;border-bottom:3px solid var(--g);font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--g)}
.slot.sp{border-bottom:none;width:16px}
.slots.bad .slot{color:var(--r);border-color:var(--r);animation:sh .35s}
.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}
.key{width:44px;height:46px;border-radius:12px;border:2px solid var(--gm);background:#fff;font-size:20px;font-weight:700;color:var(--ink);cursor:pointer}
.key.used{visibility:hidden}
.key.wide{width:auto;padding:0 12px;font-size:15px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mi{border:2px solid var(--gm);background:#fff;border-radius:12px;padding:12px 8px;font-size:15px;font-weight:600;cursor:pointer;text-align:center;min-height:52px}
.mi.sel{border-color:var(--y);background:#FFF8E1}
.mi.done{background:var(--g);border-color:var(--g);color:#fff;opacity:.55;pointer-events:none}
.mi.bad{border-color:var(--r);background:#FFEBEE;animation:sh .35s}
.sent{font-size:20px;line-height:1.6;margin:10px 0}
.gap{display:inline-block;min-width:90px;border-bottom:3px solid var(--g);color:var(--g);font-weight:800}
.fb{min-height:26px;font-weight:700;margin-top:10px}
.fb.ok{color:var(--g)}.fb.no{color:var(--r)}
.endbig{font-size:54px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.toolbar input{flex:1;min-width:150px;padding:10px 12px;border-radius:12px;border:2px solid var(--gm);font-size:15px}
.tag{font-size:12px;color:var(--mut)}
footer{text-align:center;color:var(--mut);font-size:12px;padding:18px}
@media print{header,.groups,.modes,.toolbar,.spk,footer{display:none}.w{break-inside:avoid;box-shadow:none;border:1px solid #ccc}}
</style>
</head>

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function shuf(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pool(){ return curG==="all" ? ALL : GROUPS.find(function(g){return g.id===curG;}).items; }
function exHTML(ex){ return esc(ex).replace(/\*(.+?)\*/g, "<b class=\"t\">$1</b>"); }
function target(w){ var m = w.ex.match(/\*(.+?)\*/); return m ? m[1] : w.en; }
function starStr(w){ var v=lv(w), s=""; for(var i=0;i<5;i++) s += i<v ? "★" : "☆"; return s; }
function pickSession(n){
  var p = pool().slice();
  p.sort(function(a,b){ return (lv(a)+Math.random()*1.5) - (lv(b)+Math.random()*1.5); });
  return shuf(p.slice(0, Math.min(n, p.length)));
}
function distract(w, field, n, src){
  src = src || pool(); var seen = {}; seen[field(w).toLowerCase()] = 1; var out = [];
  shuf(src.length >= 6 ? src : ALL).forEach(function(x){ var f = field(x); if(out.length<n && !seen[f.toLowerCase()]){ seen[f.toLowerCase()]=1; out.push(f); } });
  if(out.length<n) shuf(ALL).forEach(function(x){ var f=field(x); if(out.length<n && !seen[f.toLowerCase()]){ seen[f.toLowerCase()]=1; out.push(f);} });
  return out;
}

function learn(){
  var h = "<div class=\"toolbar\"><input id=\"q\" placeholder=\"🔍 Tìm từ (Anh hoặc Việt)…\"><button class=\"btn sec\" id=\"pr\">🖨️ In danh sách</button></div><div class=\"list\" id=\"lst\"></div>";
  $("main").innerHTML = h;
  function draw(){
    var q = ($("q").value||"").toLowerCase().trim();
    var s = "";
    pool().filter(function(w){ return !q || w.en.toLowerCase().indexOf(q)>=0 || w.vi.toLowerCase().indexOf(q)>=0; }).forEach(function(w){
      s += "<div class=\"w"+(lv(w)>=3?" known":"")+"\"><div class=\"row\"><div><span class=\"en\">"+esc(w.en)+"</span><span class=\"pos\">"+esc(w.pos)+"</span><div class=\"ipa\">"+esc(w.ipa)+"</div></div><button class=\"spk\" data-say=\""+esc(w.en)+"\">🔊</button></div>"

/* ---------- FLASHCARDS ---------- */
function flash(){
  var deck = shuf(pool()), i = 0;
  function show(){
    if(i >= deck.length){ deck = shuf(pool()); i = 0; }
    var w = deck[i];
    $("main").innerHTML = "<div class=\"card\"><div class=\"qtop\"><span>Thẻ "+(i+1)+"/"+deck.length+"</span><span class=\"stars\">"+starStr(w)+"</span></div>"
      + "<div class=\"flash\" id=\"fc\"><div class=\"fi\"><div class=\"fs front\"><div class=\"big\">"+esc(w.en)+"</div><div class=\"ipa\">"+esc(w.ipa)+"</div><div class=\"tag\" style=\"margin-top:14px\">👆 Chạm để lật thẻ</div></div>"
      + "<div class=\"fs back\"><div class=\"big\">"+esc(w.vi)+"</div>"+(w.cmp?"<div>→ "+esc(w.cmp)+"</div>":"")+"<div style=\"margin-top:10px;font-style:italic\">"+esc(w.ex.replace(/\*/g,""))+"</div></div></div></div>"
      + "<div class=\"row\" style=\"justify-content:center;gap:10px;flex-wrap:wrap\"><button class=\"spk\" data-say=\""+esc(w.en)+"\">🔊</button><button class=\"btn red\" id=\"no\">😕 Chưa nhớ</button><button class=\"btn\" id=\"yes\">😄 Đã nhớ</button></div></div>";
    $("fc").addEventListener("click", function(){ this.classList.toggle("flip"); });
    $("no").addEventListener("click", function(){ bump(w,false); deck.push(w); i++; show(); });
    $("yes").addEventListener("click", function(){ bump(w,true); i++; show(); });
    say(w.en);
  }
  show();
}

/* ---------- generic quiz engine (wrong = retry) ---------- */
function quiz(title, n, build){
  var items = pickSession(n), k = 0, score = 0;
  function next(){
    if(k >= items.length){ return end(); }
    var w = items[k], firstTry = true;
    var q = build(w);
    $("main").innerHTML = "<div class=\"card\"><div class=\"qtop\"><span>"+title+"</span><span>Câu "+(k+1)+"/"+items.length+" · ✅ "+score+"</span></div><div class=\"qbar\"><div style=\"width:"+(k/items.length*100)+"%\"></div></div>"
      + "<div class=\"center\">"+q.top+"</div><div class=\"opts\" id=\"opts\"></div><div class=\"fb\" id=\"fb\"></div></div>";
    var oh = ""; shuf([q.ans].concat(q.wrong)).forEach(function(o){ oh += "<button class=\"opt\" data-o=\""+esc(o)+"\">"+esc(o)+"</button>"; });
    $("opts").innerHTML = oh;
    if(q.onShow) q.onShow();
    $("opts").addEventListener("click", function(e){
      var b = e.target.closest(".opt"); if(!b || b.classList.contains("ok")) return;
      if(b.getAttribute("data-o") === q.ans){
        b.classList.add("ok"); if(firstTry) score++; bump(w, firstTry);
        $("fb").className = "fb ok"; $("fb").textContent = firstTry ? "🎉 Chính xác!" : "👍 Đúng rồi!";
        say(q.speak || w.en);
        setTimeout(function(){ k++; next(); }, 1200);
      } else {
        if(firstTry){ firstTry = false; bump(w, false); }
        b.classList.add("bad"); $("fb").className = "fb no"; $("fb").textContent = "❌ Chưa đúng, thử lại nhé!";
        setTimeout(function(){ b.classList.remove("bad"); }, 600);
      }
    });
  }
  function end(){
    var pct = Math.round(score/items.length*100);
    $("main").innerHTML = "<div class=\"card center\"><div class=\"endbig\">"+(pct>=90?"🏆":pct>=70?"🌟":pct>=50?"👍":"💪")+"</div><h2>Đúng ngay lần đầu: "+score+"/"+items.length+"</h2><p>"+(pct>=70?"Giỏi lắm! Tiếp tục phát huy nhé.":"Cố lên! Hãy luyện thêm để nhớ lâu hơn.")+"</p><button class=\"btn\" id=\"again\">🔁 Luyện tiếp</button></div>";
    $("again").addEventListener("click", run);
  }
  next();
}

    var wr = []; var seen = {}; seen[t.toLowerCase()] = 1;
    shuf(src.length>=4?src:ALL).forEach(function(x){ var tt = target(x); if(wr.length<3 && !seen[tt.toLowerCase()]){ seen[tt.toLowerCase()]=1; wr.push(tt);} });
    return { top: "<div class=\"sent\">"+s+"</div><div class=\"tag\">Gợi ý: "+esc(w.vi)+"</div>", ans: t, wrong: wr, speak: w.ex };
  });
}

/* ---------- SPELL ---------- */
function spellQ(){
  var items = pickSession(8), k = 0, score = 0;
  function next(){
    if(k >= items.length){
      $("main").innerHTML = "<div class=\"card center\"><div class=\"endbig\">✍️</div><h2>Đánh vần đúng ngay: "+score+"/"+items.length+"</h2><button class=\"btn\" id=\"again\">🔁 Luyện tiếp</button></div>";
      $("again").addEventListener("click", run); return;
    }
    var w = items[k], word = w.en.toLowerCase(), first = true, typed = [];
    var letterCount = {};
    word.split("").forEach(function(c){ letterCount[c] = (letterCount[c]||0) + 1; });
    var tiles = [];
    Object.keys(letterCount).forEach(function(c){ for(var i=0;i<letterCount[c];i++) tiles.push(c); });
    tiles = shuf(tiles);
    $("main").innerHTML = "<div class=\"card center\"><div class=\"qtop\"><span>✍️ Nghe và đánh vần</span><span>Từ "+(k+1)+"/"+items.length+" · ✅ "+score+"</span></div><div class=\"qbar\"><div style=\"width:"+(k/items.length*100)+"%\"></div></div>"
      + "<div class=\"hint\">"+esc(w.vi)+"</div><div class=\"ipa\">"+esc(w.ipa)+"</div><button class=\"btn sec\" data-say=\""+esc(w.en)+"\" style=\"margin-top:8px\">🔊 Nghe lại</button>"
      + "<div class=\"slots\" id=\"slots\"></div><div class=\"keys\" id=\"keys\"></div><div style=\"margin-top:12px\"><button class=\"key wide\" id=\"bk\">⌫ Xóa</button></div><div class=\"fb\" id=\"fb\"></div></div>";
    var kh = ""; tiles.forEach(function(c, i){ kh += "<button class=\"key"+(c===" "?" wide":"")+"\" data-i=\""+i+"\">"+(c===" "?"␣ cách":esc(c))+"</button>"; });
    $("keys").innerHTML = kh;
    function drawSlots(){
      var s = ""; for(var i=0;i<word.length;i++){ s += "<div class=\"slot"+(word[i]===" "?" sp":"")+"\">"+(typed[i]!==undefined ? (tiles[typed[i]]===" "?"":esc(tiles[typed[i]])) : "")+"</div>"; }
      $("slots").innerHTML = s;
    }
    drawSlots(); say(w.en);
    $("keys").addEventListener("click", function(e){
      var b = e.target.closest(".key"); if(!b || b.classList.contains("used")) return;
      if(typed.length >= word.length) return;
      typed.push(parseInt(b.getAttribute("data-i"),10)); b.classList.add("used"); drawSlots();
      if(typed.length === word.length){
        var ans = typed.map(function(i){return tiles[i];}).join("");
        if(ans === word){
          if(first) score++; bump(w, first);
          $("fb").className="fb ok"; $("fb").textContent = "🎉 Đúng rồi: " + w.en; say(w.en);
          setTimeout(function(){ k++; next(); }, 1300);
        } else {
          if(first){ first=false; bump(w,false); }
          $("slots").classList.add("bad"); $("fb").className="fb no"; $("fb").textContent="❌ Chưa đúng, thử lại nhé!";
          setTimeout(function(){ $("slots").classList.remove("bad"); typed = []; document.querySelectorAll("#keys .key").forEach(function(x){x.classList.remove("used");}); drawSlots(); }, 900);
        }
      }
    });
    $("bk").addEventListener("click", function(){ if(!typed.length) return; var i = typed.pop(); document.querySelector("#keys .key[data-i=\""+i+"\"]").classList.remove("used"); drawSlots(); });
  }
  next();
}

/* ---------- MATCH ---------- */
function matchQ(){
  var set = pickSession(5), done = 0, sel = null, errs = 0, wrongIds = {};
  var L = shuf(set), R = shuf(set);
  var h = "<div class=\"card\"><div class=\"qtop\"><span>🔗 Ghép từ với nghĩa</span><span id=\"mst\">0/"+set.length+"</span></div><div class=\"match\"><div class=\"col\">";
  L.forEach(function(w){ h += "<div class=\"mi\" data-side=\"L\" data-id=\""+esc(w.id)+"\">"+esc(w.en)+"</div>"; });
  h += "</div><div class=\"col\">";
  R.forEach(function(w){ h += "<div class=\"mi\" data-side=\"R\" data-id=\""+esc(w.id)+"\">"+esc(w.vi)+"</div>"; });
  h += "</div></div><div class=\"fb\" id=\"fb\"></div></div>";
  $("main").innerHTML = h;
  $("main").querySelector(".match").addEventListener("click", function(e){
    var b = e.target.closest(".mi"); if(!b || b.classList.contains("done")) return;
    if(b.getAttribute("data-side")==="L"){ var w0 = ALL.find(function(x){return x.id===b.getAttribute("data-id");}); say(w0.en); }
    if(!sel || sel.getAttribute("data-side") === b.getAttribute("data-side")){
      if(sel) sel.classList.remove("sel"); sel = b; b.classList.add("sel"); return;
    }
    var id1 = sel.getAttribute("data-id"), id2 = b.getAttribute("data-id");
    if(id1 === id2){
      sel.classList.remove("sel"); sel.classList.add("done"); b.classList.add("done"); done++;
      var w = ALL.find(function(x){return x.id===id1;}); bump(w, !wrongIds[id1]);
      $("mst").textContent = done + "/" + set.length;
      if(done === set.length){ $("fb").className="fb ok"; $("fb").innerHTML = "🎉 Hoàn thành! <button class=\"btn\" id=\"again\" style=\"margin-left:8px\">🔁 Bộ mới</button>"; $("again").addEventListener("click", run); }
    } else {
      wrongIds[id1] = 1; wrongIds[id2] = 1; errs++;
      var a = sel, c = b; a.classList.add("bad"); c.classList.add("bad");
      setTimeout(function(){ a.classList.remove("bad","sel"); c.classList.remove("bad"); }, 500);
    }
    sel = null;
  });
}

/* ---------- REVIEW HARD WORDS ---------- */
function reviewQ(){
  var hard = pool().filter(function(w){ return lv(w) < 3; });
  if(!hard.length){ $("main").innerHTML = "<div class=\"card center\"><div class=\"endbig\">🏆</div><h2>Tuyệt vời!</h2><p>Em đã thuộc hết các từ trong nhóm này. Chọn nhóm khác hoặc luyện lại để giữ trí nhớ nhé.</p></div>"; return; }
  var items = shuf(hard).slice(0, 10), k = 0, score = 0;
  var types = ["listen","mean","fill"];
  function next(){
    if(k >= items.length){ $("main").innerHTML = "<div class=\"card center\"><div class=\"endbig\">🔥</div><h2>Ôn xong: "+score+"/"+items.length+" đúng ngay</h2><p>Còn "+pool().filter(function(w){return lv(w)<3;}).length+" từ cần ôn.</p><button class=\"btn\" id=\"again\">🔁 Ôn tiếp</button></div>"; $("again").addEventListener("click", run); return; }
    var w = items[k], t = types[k % 3], first = true, q;
    if(t === "listen") q = { top: "<p class=\"hint\">🎧 Nghe và chọn từ</p><button class=\"btn\" data-say=\""+esc(w.en)+"\">🔊 Nghe lại</button>", ans: w.en, wrong: distract(w,function(x){return x.en;},3) };
    else if(t === "mean") q = { top: "<div class=\"big\">"+esc(w.en)+"</div><div class=\"ipa\">"+esc(w.ipa)+"</div>", ans: w.vi, wrong: distract(w,function(x){return x.vi;},3) };
    else { var tg = target(w), seen = {}; seen[tg.toLowerCase()]=1; var wr = []; shuf(ALL.filter(function(x){return x.g===w.g;})).forEach(function(x){ var tt=target(x); if(wr.length<3 && !seen[tt.toLowerCase()]){ seen[tt.toLowerCase()]=1; wr.push(tt);} });
      q = { top: "<div class=\"sent\">"+esc(w.ex).replace(/\*(.+?)\*/, "<span class=\"gap\">&nbsp;?&nbsp;</span>")+"</div><div class=\"tag\">Gợi ý: "+esc(w.vi)+"</div>", ans: tg, wrong: wr }; }
    $("main").innerHTML = "<div class=\"card\"><div class=\"qtop\"><span>🔥 Ôn từ khó</span><span>Câu "+(k+1)+"/"+items.length+" · ✅ "+score+"</span></div><div class=\"qbar\"><div style=\"width:"+(k/items.length*100)+"%\"></div></div><div class=\"center\">"+q.top+"</div><div class=\"opts\" id=\"opts\"></div><div class=\"fb\" id=\"fb\"></div></div>";
    var oh = ""; shuf([q.ans].concat(q.wrong)).forEach(function(o){ oh += "<button class=\"opt\" data-o=\""+esc(o)+"\">"+esc(o)+"</button>"; });
    $("opts").innerHTML = oh;
    if(t !== "fill") say(w.en);
    $("opts").addEventListener("click", function(e){
      var b = e.target.closest(".opt"); if(!b || b.classList.contains("ok")) return;
      if(b.getAttribute("data-o") === q.ans){ b.classList.add("ok"); if(first) score++; bump(w, first); $("fb").className="fb ok"; $("fb").textContent="🎉 Chính xác!"; say(t==="fill"?w.ex:w.en); setTimeout(function(){k++; next();}, 1200); }
      else { if(first){ first=false; bump(w,false);} b.classList.add("bad"); $("fb").className="fb no"; $("fb").textContent="❌ Thử lại nhé!"; setTimeout(function(){ b.classList.remove("bad"); }, 600); }
    });
  }
  next();
}

/* ---------- LISTEN & TYPE ---------- */
function typeQ(){
  var items = pickSession(10), k = 0, score = 0;
  function nrm(s){ return s.toLowerCase().replace(/[’']/g,"'").replace(/ +/g," ").replace(/^ | $/g,"").replace(/[.!?,]+$/,""); }
  function next(){
    if(k >= items.length){
      $("main").innerHTML = "<div class=\"card center\"><div class=\"endbig\">⌨️</div><h2>Gõ đúng ngay lần đầu: "+score+"/"+items.length+"</h2><p>"+(score/items.length>=0.7?"Giỏi lắm! Tai nghe và chính tả của em rất tốt.":"Cố lên! Nghe kỹ từng âm rồi gõ lại nhé.")+"</p><button class=\"btn\" id=\"again\">🔁 Luyện tiếp</button></div>";
      $("again").addEventListener("click", run); return;
    }
    var w = items[k], first = true, tries = 0, busy = false;
    $("main").innerHTML = "<div class=\"card center\"><div class=\"qtop\"><span>⌨️ Nghe và gõ từ</span><span>Từ "+(k+1)+"/"+items.length+" · ✅ "+score+"</span></div><div class=\"qbar\"><div style=\"width:"+(k/items.length*100)+"%\"></div></div>"
      + "<p class=\"hint\">Nghe và gõ lại từ em nghe được</p>"
      + "<div class=\"row\" style=\"justify-content:center;gap:10px;flex-wrap:wrap\"><button class=\"btn\" data-say=\""+esc(w.en)+"\">🔊 Nghe lại</button><button class=\"btn sec\" id=\"slow\">🐢 Nghe chậm</button></div>"
      + "<div id=\"hintbox\"></div>"
      + "<input class=\"tin\" id=\"tin\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" placeholder=\"Gõ từ ở đây…\">"
      + "<div style=\"margin-top:12px\"><button class=\"btn\" id=\"chk\">✔ Kiểm tra</button></div><div class=\"fb\" id=\"fb\"></div></div>";
    say(w.en); setTimeout(function(){ $("tin").focus(); }, 150);
    $("slow").addEventListener("click", function(){
      if(!("speechSynthesis" in window)) return; speechSynthesis.cancel();
      setTimeout(function(){ var u = new SpeechSynthesisUtterance(w.en); u.lang="en-GB"; u.rate=0.45; if(VOICE) u.voice=VOICE; speechSynthesis.speak(u); }, 80);
    });
    function check(){
      if(busy) return;
      var v = nrm($("tin").value); if(!v) return;
      if(v === nrm(w.en)){
        busy = true; if(first) score++; bump(w, first);
        $("tin").className = "tin ok"; $("tin").disabled = true;
        $("fb").className = "fb ok"; $("fb").textContent = "🎉 Chính xác! " + w.en + " = " + w.vi; say(w.en);
        setTimeout(function(){ k++; next(); }, 1500);
      } else {
        if(first){ first = false; bump(w, false); }
        tries++;
        $("tin").className = "tin bad"; setTimeout(function(){ $("tin").className = "tin"; }, 500);
        $("fb").className = "fb no"; $("fb").textContent = "❌ Chưa đúng, nghe lại và gõ lại nhé!";
        if(tries === 2) $("hintbox").innerHTML = "<div class=\"tag\" style=\"margin-top:10px\">💡 Gợi ý nghĩa: <b>"+esc(w.vi)+"</b></div>";
        if(tries >= 3){
          var m = w.en.split("").map(function(c, i){ return c===" " ? "  " : (i===0 || w.en[i-1]===" " ? c : "_"); }).join(" ");
          $("hintbox").innerHTML = "<div class=\"tag\" style=\"margin-top:10px\">💡 Gợi ý nghĩa: <b>"+esc(w.vi)+"</b></div><div class=\"mask\">"+esc(m)+"</div>";
        }
        say(w.en); $("tin").select();
      }
    }
    $("chk").addEventListener("click", check);
    $("tin").addEventListener("keydown", function(e){ if(e.key === "Enter") check(); });
  }
  next();
}

nav(); updProg(); run();
</script>
